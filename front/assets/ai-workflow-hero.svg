<svg width="900" height="760" viewBox="0 0 900 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI workflow visual</title>
  <desc id="desc">An abstract luminous network connecting an idea to content, tools, workflow and real delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="30" x2="820" y2="740" gradientUnits="userSpaceOnUse"><stop stop-color="#101A2F"/><stop offset=".52" stop-color="#102F4A"/><stop offset="1" stop-color="#061018"/></linearGradient>
    <linearGradient id="beam" x1="160" y1="150" x2="760" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#63F5CB"/><stop offset=".46" stop-color="#62A5FF"/><stop offset="1" stop-color="#9C7CFF"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".17"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".03"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#8BC6FF" stroke-opacity=".11" stroke-width="1"/></pattern>
  </defs>
  <rect width="900" height="760" rx="42" fill="url(#bg)"/>
  <rect width="900" height="760" rx="42" fill="url(#grid)"/>
  <circle cx="690" cy="160" r="170" fill="#5B8CFF" fill-opacity=".18" filter="url(#soft)"/>
  <circle cx="220" cy="620" r="190" fill="#4CF0C4" fill-opacity=".12" filter="url(#soft)"/>
  <path d="M116 232C202 128 303 136 365 236C426 334 493 390 575 318C659 244 727 238 798 314" stroke="url(#beam)" stroke-width="2" stroke-dasharray="8 12" opacity=".85"/>
  <path d="M114 472C229 418 279 514 357 568C430 619 521 580 582 493C637 413 704 403 803 480" stroke="url(#beam)" stroke-width="2" stroke-dasharray="3 10" opacity=".7"/>
  <path d="M160 170L160 590M740 160L740 604" stroke="#A1D9FF" stroke-opacity=".18" stroke-dasharray="2 12"/>
  <g filter="url(#glow)"><circle cx="116" cy="232" r="8" fill="#63F5CB"/><circle cx="365" cy="236" r="8" fill="#62A5FF"/><circle cx="575" cy="318" r="8" fill="#9C7CFF"/><circle cx="798" cy="314" r="8" fill="#63F5CB"/><circle cx="114" cy="472" r="7" fill="#62A5FF"/><circle cx="357" cy="568" r="7" fill="#63F5CB"/><circle cx="582" cy="493" r="7" fill="#9C7CFF"/><circle cx="803" cy="480" r="7" fill="#63F5CB"/></g>
  <g transform="translate(90 250)"><rect width="176" height="118" rx="18" fill="url(#glass)" stroke="#8EE5D2" stroke-opacity=".5"/><circle cx="28" cy="30" r="10" fill="#63F5CB"/><text x="50" y="36" fill="#D9FFF6" font-family="monospace" font-size="16" letter-spacing="2">IDEA</text><path d="M28 64H146M28 80H118M28 96H84" stroke="#A9D8FF" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/></g>
  <g transform="translate(310 170)"><rect width="196" height="130" rx="18" fill="url(#glass)" stroke="#8DC6FF" stroke-opacity=".56"/><circle cx="32" cy="32" r="10" fill="#62A5FF"/><text x="55" y="38" fill="#E2EEFF" font-family="monospace" font-size="16" letter-spacing="2">CONTENT</text><path d="M28 70H164M28 88H142M28 106H108" stroke="#9CC9FF" stroke-opacity=".72" stroke-width="3" stroke-linecap="round"/></g>
  <g transform="translate(522 345)"><rect width="196" height="130" rx="18" fill="url(#glass)" stroke="#B9A2FF" stroke-opacity=".6"/><circle cx="32" cy="32" r="10" fill="#9C7CFF"/><text x="55" y="38" fill="#F0E9FF" font-family="monospace" font-size="16" letter-spacing="2">WORKFLOW</text><path d="M28 70H164M28 88H142M28 106H108" stroke="#C8B9FF" stroke-opacity=".72" stroke-width="3" stroke-linecap="round"/></g>
  <g transform="translate(198 490)"><rect width="210" height="138" rx="18" fill="url(#glass)" stroke="#8EE5D2" stroke-opacity=".56"/><circle cx="34" cy="34" r="10" fill="#63F5CB"/><text x="58" y="40" fill="#D9FFF6" font-family="monospace" font-size="16" letter-spacing="2">DELIVERY</text><path d="M30 78H176M30 97H150M30 116H116" stroke="#A9F4DD" stroke-opacity=".72" stroke-width="3" stroke-linecap="round"/></g>
  <g opacity=".8"><text x="52" y="700" fill="#9FC0D5" font-family="monospace" font-size="11" letter-spacing="3">DAHAN / HUMAN × AI / 2026</text><text x="690" y="700" fill="#9FC0D5" font-family="monospace" font-size="11" letter-spacing="2">BUILD · TEST · DELIVER</text></g>
</svg>
